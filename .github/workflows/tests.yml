name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['10.*', '11.*', '12.*']
        stability: [prefer-stable]
        exclude:
          # Laravel 10 requires PHP ^8.1 but our package requires ^8.2 — all combos valid.
          # Laravel 12 dropped official PHP 8.1 support — no exclusions needed here.

    name: PHP ${{ matrix.php }} — Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: xdebug

      - name: Resolve Testbench version for Laravel ${{ matrix.laravel }}
        id: testbench
        run: |
          if [[ "${{ matrix.laravel }}" == "10.*" ]]; then
            echo "version=^8.0" >> $GITHUB_OUTPUT
          elif [[ "${{ matrix.laravel }}" == "11.*" ]]; then
            echo "version=^9.0" >> $GITHUB_OUTPUT
          else
            echo "version=^10.0" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        run: |
          composer require \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ steps.testbench.outputs.version }}" \
            --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/pest --ci

      - name: Run tests with coverage
        if: matrix.php == '8.3' && matrix.laravel == '11.*'
        run: vendor/bin/pest --coverage --min=80
