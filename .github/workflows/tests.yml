name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            laravel: '8.*'
            testbench: '^6.47'
            pest: '^1.22.1'
            pest_plugin: '^1.4.0'
            stability: prefer-lowest
          - php: '8.1'
            laravel: '8.*'
            testbench: '^6.47'
            pest: '^1.22.1'
            pest_plugin: '^1.4.0'
            stability: prefer-stable
          - php: '8.1'
            laravel: '9.*'
            testbench: '^7.56'
            pest: '^1.22.1'
            pest_plugin: '^1.4.0'
            stability: prefer-lowest
          - php: '8.1'
            laravel: '9.*'
            testbench: '^7.56'
            pest: '^1.22.1'
            pest_plugin: '^1.4.0'
            stability: prefer-stable
          - php: '8.1'
            laravel: '10.*'
            testbench: '^8.37'
            pest: '^2.36.0'
            pest_plugin: '^2.4.0'
            stability: prefer-lowest
          - php: '8.3'
            laravel: '10.*'
            testbench: '^8.37'
            pest: '^2.36.0'
            pest_plugin: '^2.4.0'
            stability: prefer-stable
          - php: '8.2'
            laravel: '11.*'
            testbench: '^9.17'
            pest: '^2.36.0'
            pest_plugin: '^2.4.0'
            stability: prefer-lowest
          - php: '8.4'
            laravel: '11.*'
            testbench: '^9.17'
            pest: '^2.36.0'
            pest_plugin: '^2.4.0'
            stability: prefer-stable
          - php: '8.2'
            laravel: '12.*'
            testbench: '^10.11'
            pest: '^3.8.2'
            pest_plugin: '^3.2.0'
            stability: prefer-lowest
          - php: '8.4'
            laravel: '12.*'
            testbench: '^10.11'
            pest: '^3.8.2'
            pest_plugin: '^3.2.0'
            stability: prefer-stable

    name: PHP ${{ matrix.php }} — Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: xdebug

      - name: Install dependencies
        run: |
          composer config audit.block-insecure false
          composer require \
            --dev \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "pestphp/pest:${{ matrix.pest }}" \
            "pestphp/pest-plugin-laravel:${{ matrix.pest_plugin }}" \
            --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/pest --colors=always

      - name: Run tests with coverage
        if: matrix.php == '8.4' && matrix.laravel == '12.*' && matrix.stability == 'prefer-stable'
        run: vendor/bin/pest --coverage --min=80
